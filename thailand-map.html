<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แผนที่ยอดขายประเทศไทย</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#f1f5f9; --surface:#ffffff; --surface-2:#f8fafc; --ink:#0f172a; --muted:#64748b;
    --line:#e2e8f0; --line-2:#cbd5e1; --accent:#2563eb; --good:#16a34a; --bad:#ef4444;
    --panel-w:360px;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0b1220; --surface:#131c2e; --surface-2:#1b273c; --ink:#e8edf6; --muted:#94a3b8;
    --line:#243149; --line-2:#334155; --accent:#60a5fa;
  }}
  :root[data-theme="dark"]{ --bg:#0b1220; --surface:#131c2e; --surface-2:#1b273c; --ink:#e8edf6; --muted:#94a3b8; --line:#243149; --line-2:#334155; --accent:#60a5fa; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Sarabun","Segoe UI",system-ui,sans-serif}
  #map{position:absolute;inset:0;background:var(--bg);z-index:1}
  .leaflet-container{background:var(--bg);font-family:inherit}
  /* top control panel — unified glass card: controls row + KPI row */
  .bar{position:absolute;top:12px;left:12px;right:12px;z-index:1000;display:flex;flex-direction:column;gap:9px;
       background:color-mix(in oklab,var(--surface) 90%,transparent);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:0 10px 34px -16px rgba(0,0,0,.45)}
  .bar-main{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .bar .back{text-decoration:none;color:var(--muted);font-weight:700;font-size:13px;border:1px solid var(--line-2);border-radius:10px;padding:7px 11px;background:var(--surface);cursor:pointer;transition:.12s}
  .bar .back:hover{border-color:var(--accent);color:var(--ink)}
  .bar .ttl{font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px;margin-right:4px}
  .bar .ttl .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in oklab,var(--accent) 22%,transparent)}
  .bar .ttl .muted2{color:var(--muted);font-weight:600;font-size:12.5px}
  .seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px}
  .seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:.1s}
  .seg button.on{background:var(--accent);color:#fff;box-shadow:0 2px 8px -3px var(--accent)}
  select,.chk{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 10px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .chk{display:inline-flex;align-items:center;gap:6px;user-select:none}
  .sp{flex:1}
  /* KPI row — sleek inline stats inside the panel */
  .kpis{display:flex;flex-wrap:wrap;align-items:stretch;gap:0;border-top:1px solid var(--line);padding-top:9px;margin-top:1px}
  .kpi{display:flex;flex-direction:column;justify-content:center;padding:0 18px 0 0;margin-right:18px;border-right:1px solid var(--line)}
  .kpi:last-child{border-right:0;margin-right:0;padding-right:0}
  .kpi .k{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.2px}
  .kpi .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
  /* legend */
  .legend{position:absolute;left:12px;bottom:16px;z-index:900;background:color-mix(in oklab,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 6px 20px -12px rgba(0,0,0,.35);font-size:11px}
  .legend .lh{font-weight:800;margin-bottom:6px;font-size:11.5px}
  .legend .row{display:flex;align-items:center;gap:7px;margin:3px 0}
  .legend .sw{width:16px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.15)}
  /* right panel */
  .panel{position:absolute;top:0;right:0;bottom:0;width:var(--panel-w);max-width:92vw;z-index:1100;background:var(--surface);border-left:1px solid var(--line);
         box-shadow:-12px 0 36px -20px rgba(0,0,0,.5);transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column}
  .panel.open{transform:none}
  .panel .ph{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .panel .ph .pn{font-size:17px;font-weight:800;flex:1;min-width:0}
  .panel .ph .px{border:1px solid var(--line-2);background:var(--surface);color:var(--muted);border-radius:8px;width:30px;height:30px;font-size:16px;cursor:pointer;flex:none}
  .panel .pb{padding:14px 16px;overflow-y:auto;flex:1}
  .pkpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .pkpi .c{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:9px 11px}
  .pkpi .c .k{font-size:10.5px;color:var(--muted);font-weight:700}
  .pkpi .c .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
  .dh{font-size:12.5px;font-weight:800;margin:4px 0 9px;display:flex;align-items:center;gap:6px}
  .drow{margin-bottom:9px}
  .drow .t{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:3px}
  .drow .t .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .drow .t .vv{font-weight:800;font-variant-numeric:tabular-nums;flex:none;color:var(--accent)}
  .drow .bar2{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden}
  .drow .bar2 i{display:block;height:100%;border-radius:5px;background:var(--accent)}
  .drow .sub{font-size:10.5px;color:var(--muted);margin-top:2px}
  /* loading / msg */
  .msg{position:absolute;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--bg);color:var(--muted);font-weight:600}
  .spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hint{position:absolute;right:12px;bottom:16px;z-index:900;background:color-mix(in oklab,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:11px;color:var(--muted);font-weight:600}
  .lapse{position:absolute;right:30px;top:50%;transform:translateY(-50%);z-index:850;font-size:68px;font-weight:900;color:color-mix(in oklab,var(--accent) 34%,transparent);pointer-events:none;letter-spacing:1px;text-align:right}
  #playBtn.on{background:var(--accent);color:#fff;border-color:transparent}
  @media(max-width:720px){ .kpis{top:112px} .legend{display:none} }
  .leaflet-tooltip.pv{background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:9px;box-shadow:0 8px 24px -12px rgba(0,0,0,.5);font-family:inherit;font-size:12.5px;padding:7px 10px}
  .leaflet-tooltip.pv b{font-size:13.5px}
  .leaflet-tooltip.distlbl{background:transparent;border:0;box-shadow:none;color:var(--ink);font-family:inherit;font-size:11px;font-weight:700;padding:0;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .leaflet-tooltip.distlbl{color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}}
  .leaflet-tooltip.distlbl::before{display:none}
  .leaflet-tooltip.pv .tnum{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="map"></div>

<div class="bar">
  <div class="bar-main">
    <button class="back" id="homeBtn" title="กลับหน้าหลัก">‹ หน้าหลัก</button>
    <div class="ttl"><span class="dot"></span>แผนที่ยอดขาย <span class="muted2">ประเทศไทย</span></div>
    <select id="tabSel" title="แบรนด์ / เดือน"></select>
    <select id="chanSel" title="ช่องทาง"><option value="">ทุกช่องทาง</option></select>
    <div class="seg" id="metricSeg">
      <button data-m="orders" class="on">ออเดอร์</button>
      <button data-m="sales">ยอดขาย</button>
      <button data-m="aov">AOV</button>
      <button data-m="units">ชิ้น</button>
    </div>
    <div class="seg" id="modeSeg" title="มุมมองสี">
      <button data-mode="value" class="on">ยอด</button>
      <button data-mode="growth">📈 การเติบโต</button>
    </div>
    <label class="chk"><input type="checkbox" id="exCancel" checked> ไม่นับยกเลิก</label>
    <span class="sp"></span>
    <button class="back" id="playBtn" title="เล่นไล่เดือน (time-lapse)">▶ ไล่เดือน</button>
    <button class="back" id="resetBtn" title="ดูทั้งประเทศ">⤢ ทั้งประเทศ</button>
  </div>
  <div class="kpis" id="kpis"></div>
</div>

<div class="legend" id="legend"></div>
<div class="hint">แตะจังหวัดเพื่อซูม + ดูอำเภอบนแผนที่</div>
<div class="lapse" id="lapseLbl" style="display:none"></div>

<aside class="panel" id="panel">
  <div class="ph"><div class="pn" id="pName">—</div><button class="px" id="pClose">✕</button></div>
  <div class="pb" id="pBody"></div>
</aside>

<div class="msg" id="msg"><div class="spin"></div><div id="msgT">กำลังโหลดแผนที่…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SHEET='1uc46n128puQkaUQJ_eiy3ZhRgSUeSRcE50HKB3H5a-Q';
const GEO_URL='https://cdn.jsdelivr.net/gh/chingchai/OpenGISData-Thailand@master/provinces.geojson';
const DIST_URL='https://cdn.jsdelivr.net/gh/chingchai/OpenGISData-Thailand@master/districts.geojson';
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;};
const fmt=n=>Math.round(n).toLocaleString('en-US');
const kOf=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':fmt(n);
const parseTs=s=>{ const m=String(s||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/); return m?new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0)).getTime():0; };
const DAY=864e5;
function parseCSV(t){const R=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=h}else{if(h==='"')q=true;else if(h===','){r.push(c);c=""}else if(h==='\n'){r.push(c);R.push(r);r=[];c=""}else if(h==='\r'){}else c+=h}}if(c!==""||r.length){r.push(c);R.push(r)}return R}
async function csv(gid){const t=await (await fetch(`https://docs.google.com/spreadsheets/d/${SHEET}/export?format=csv&gid=${gid}&cb=${Date.now()}`)).text();return t.trim().startsWith('<')?[]:parseCSV(t);}

/* ---- province name normalizer → canonical Thai (77) ---- */
let CANON=new Map();        // normalized key → canonical pro_th
let CANON_EN=new Map();     // normalized english → pro_th
const stripTone=s=>String(s||'').replace(/[ัิ-ฺ็-๎\s]/g,'').toLowerCase();
const ALIAS={ 'กรุงเทพฯ':'กรุงเทพมหานคร','กทม':'กรุงเทพมหานคร','กรุงเทพ':'กรุงเทพมหานคร','บางกอก':'กรุงเทพมหานคร','กรุงเทพมหานคร(bangkok)':'กรุงเทพมหานคร' };
function buildCanon(geo){ geo.features.forEach(f=>{ const th=f.properties.pro_th, en=f.properties.pro_en;
  CANON.set(stripTone(th), th); if(en) CANON_EN.set(String(en).toLowerCase().replace(/\s/g,''), th); }); }
function matchProvince(raw){ let s=String(raw||'').trim(); if(!s) return null;
  if(ALIAS[s]) return ALIAS[s];
  // strip municipal / admin prefixes
  s=s.replace(/^(เทศบาลนคร|เทศบาลเมือง|เทศบาลตำบล|อบต\.?|องค์การบริหารส่วนตำบล|อำเภอเมือง|อ\.เมือง|จังหวัด|จ\.)/,'').trim();
  const n=stripTone(s); if(CANON.has(n)) return CANON.get(n);
  const en=String(s).toLowerCase().replace(/\s/g,''); if(CANON_EN.has(en)) return CANON_EN.get(en);
  for(const [k,v] of CANON){ if(n&&(n.startsWith(k)||k.startsWith(n))&&Math.abs(n.length-k.length)<=3) return v; }
  return null;
}
const cleanDistrict=s=>String(s||'').replace(/^(อำเภอ|อ\.|เขต|เทศบาลนคร|เทศบาลเมือง|เทศบาลตำบล)\s*/,'').trim();

/* ---- data ---- */
let TABS=[], RAW={}, GEO=null, AGG=null, METRIC='orders', SELTAB=null;
let MODE='value', PLAYING=false, GROWTH=null, DISTGEO=null, distLayer=null, FIXEDBREAKS=null, FOCUS=false, FOCUSPROV=null;
let CUST={};   // brand -> pooled order-level customer data (buyer identity used only to COUNT, never shown)
const METRIC_LABEL={orders:'ออเดอร์',sales:'ยอดขาย (บาท)',aov:'AOV (บาท/ออเดอร์)',units:'จำนวนชิ้น'};
const MINUM={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function tabMeta(name){ const b=/benutra/i.test(name)?'Benutra':/gala/i.test(name)?'Gala':/terry/i.test(name)?'Terry':'?';
  const M={jan:'ม.ค.',feb:'ก.พ.',mar:'มี.ค.',apr:'เม.ย.',may:'พ.ค.',jun:'มิ.ย.',jul:'ก.ค.',aug:'ส.ค.',sep:'ก.ย.',oct:'ต.ค.',nov:'พ.ย.',dec:'ธ.ค.'};
  const mm=(name.match(/jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec/i)||[''])[0].toLowerCase();
  return { brand:b, month:M[mm]||'', mi:MINUM[mm]||0, label:b+(M[mm]?' · '+M[mm]+' 2026':'') }; }
async function enumTabs(){
  try{ const html=await (await fetch(`https://docs.google.com/spreadsheets/d/${SHEET}/htmlview?cb=${Date.now()}`)).text();
    const re=/items\.push\(\{name:\s*"([^"]+)",\s*pageUrl[^}]*?gid=(\d+)/g; let m; const out=[];
    while((m=re.exec(html))) out.push({ name:m[1], gid:m[2], ...tabMeta(m[1]) });
    if(out.length) return out;
  }catch{}
  // fallback to known tabs
  return [ {name:'Terry Oct',gid:'0'},{name:'Terry Sep',gid:'930696133'},{name:'Terry Aug',gid:'1575732172'},{name:'Benutra Oct',gid:'872548769'},{name:'Gala Oct',gid:'1811880977'} ].map(t=>({...t,...tabMeta(t.name)}));
}
/* parse ONE tab into PII-free rows (only geo + amount + status + channel) */
async function loadTab(gid){ if(RAW[gid]) return RAW[gid];
  const g=await csv(gid); if(!g.length){ RAW[gid]=[]; return RAW[gid]; }
  const H=g[0], ci=n=>H.indexOf(n);
  const cOid=ci('Order ID'),cProv=ci('Province'),cDist=ci('District')>=0?ci('District'):ci('Districts'),
        cSub=ci('SKU Subtotal After Discount')>=0?ci('SKU Subtotal After Discount'):ci('Order Amount'),
        cQty=ci('Quantity'),cStat=ci('Order Status'),cChan=ci('Order Channel'),cProd=ci('Product Name'),
        cBuyer=ci('Buyer Username'),cCreated=ci('Created Time');
  const rows=[];
  for(let i=1;i<g.length;i++){ const r=g[i]; const oid=r[cOid]; if(!oid)continue;
    rows.push({ oid, prov:matchProvince(r[cProv]), dist:cleanDistrict(r[cDist]),
      sub:num(r[cSub]), qty:num(r[cQty]), cancel:/cancel/i.test(String(r[cStat]||'')), chan:String(r[cChan]||'').trim()||'—', prod:String(r[cProd]||'').trim(),
      buyer:String(r[cBuyer]||'').trim(), ts:parseTs(r[cCreated]) }); }
  RAW[gid]=rows; return rows;
}
/* aggregate current tab under filters → per-province + per-district */
function aggregate(){ return aggregateRows(RAW[SELTAB.gid]||[]); }
function aggregateRows(rows){ const exCancel=$('#exCancel').checked; const chan=$('#chanSel').value;
  const prov={}; const seenO=new Set(); let tOrders=new Set(), tSales=0, tUnits=0, dropped=0; const chans=new Set();
  for(const r of rows){ if(r.chan) chans.add(r.chan);
    if(exCancel&&r.cancel) continue; if(chan&&r.chan!==chan) continue;
    if(!r.prov){ dropped++; continue; }
    const p=prov[r.prov]=prov[r.prov]||{orders:new Set(),sales:0,units:0,dist:{}};
    p.orders.add(r.oid); p.sales+=r.sub; p.units+=r.qty;
    tOrders.add(r.oid); tSales+=r.sub; tUnits+=r.qty;
    const d=r.dist||'(ไม่ระบุอำเภอ)'; const dd=p.dist[d]=p.dist[d]||{orders:new Set(),sales:0,units:0};
    dd.orders.add(r.oid); dd.sales+=r.sub; dd.units+=r.qty;
  }
  const P={}; for(const k in prov){ const o=prov[k]; const orders=o.orders.size;
    P[k]={ orders, sales:o.sales, units:o.units, aov:orders?o.sales/orders:0,
      dist:Object.entries(o.dist).map(([n,d])=>({n, orders:d.orders.size, sales:d.sales, units:d.units, aov:d.orders.size?d.sales/d.orders.size:0})).sort((a,b)=>b.orders-a.orders) }; }
  return { prov:P, total:{orders:tOrders.size, sales:tSales, units:tUnits, aov:tOrders.size?tSales/tOrders.size:0, provinces:Object.keys(P).length, dropped}, chans:[...chans].sort() };
}
const metricVal=(o,m)=>!o?0:(m==='orders'?o.orders:m==='sales'?o.sales:m==='units'?o.units:o.aov);
/* top products for one district (scans the current tab under filters; PII-free) */
function districtProducts(prov,distName){ const rows=RAW[SELTAB.gid]||[]; const exCancel=$('#exCancel').checked; const chan=$('#chanSel').value;
  const key=normD(distName); const prods={}; const ord=new Set(); let sales=0,units=0;
  for(const r of rows){ if(exCancel&&r.cancel)continue; if(chan&&r.chan!==chan)continue; if(r.prov!==prov)continue;
    if(normD(r.dist||'(ไม่ระบุอำเภอ)')!==key)continue; ord.add(r.oid); sales+=r.sub; units+=r.qty;
    const nm=r.prod||'(ไม่ระบุสินค้า)'; const p=prods[nm]=prods[nm]||{qty:0,sales:0}; p.qty+=r.qty; p.sales+=r.sub; }
  return { orders:ord.size, sales, units, aov:ord.size?sales/ord.size:0,
    prods:Object.entries(prods).map(([n,p])=>({n,qty:p.qty,sales:p.sales})).sort((a,b)=>b.qty-a.qty) }; }

/* ===== customer new/returning + repeat analysis (pools ALL months of the brand) =====
   Buyer Username is used ONLY as a grouping key to COUNT customers — never displayed or stored. */
async function ensureCust(brand){ if(CUST[brand]) return CUST[brand];
  const months=TABS.filter(t=>t.brand===brand); await Promise.all(months.map(t=>loadTab(t.gid)));
  const orders=new Map(), firstByBuyer=new Map(); let maxTs=0;
  for(const t of months){ for(const r of (RAW[t.gid]||[])){ if(!r.buyer)continue;
    if(!orders.has(r.oid)) orders.set(r.oid,{buyer:r.buyer,ts:r.ts,prov:r.prov,dist:r.dist,cancel:r.cancel,chan:r.chan});
    if(r.ts>maxTs)maxTs=r.ts; const f=firstByBuyer.get(r.buyer); if(f==null||(r.ts&&r.ts<f)) firstByBuyer.set(r.buyer,r.ts); } }
  return CUST[brand]={orders,firstByBuyer,maxTs};
}
function customerStats(prov,dist){ const c=CUST[SELTAB.brand]; if(!c) return null;
  const exCancel=$('#exCancel').checked, chan=$('#chanSel').value, dkey=dist?normD(dist):null;
  const byBuyer=new Map();
  c.orders.forEach(o=>{ if(exCancel&&o.cancel)return; if(chan&&o.chan!==chan)return; if(o.prov!==prov)return; if(dkey&&normD(o.dist||'')!==dkey)return;
    let a=byBuyer.get(o.buyer); if(!a){a=[];byBuyer.set(o.buyer,a);} if(o.ts)a.push(o.ts); });
  const d30=c.maxTs-30*DAY; const monStart=new Date(2026,SELTAB.mi-1,1).getTime(), monEnd=new Date(2026,SELTAB.mi,1).getTime();
  let total=0,repeat=0,rep3=0,active30=0,rep60=0,newM=0,retM=0;
  byBuyer.forEach((ts,buyer)=>{ total++; const n=ts.length; if(n>=2)repeat++; if(n>=3)rep3++;
    if(ts.some(t=>t>=d30))active30++;
    ts.sort((a,b)=>a-b); for(let i=1;i<n;i++){ if(ts[i]-ts[i-1]<=60*DAY){rep60++;break;} }
    if(ts.some(t=>t>=monStart&&t<monEnd)){ const first=c.firstByBuyer.get(buyer); if(first>=monStart)newM++; else retM++; } });
  return { total, repeat, rep3, active30, rep60, newM, retM, repeatPct: total?repeat/total*100:0 };
}
function custBlock(prov,dist){ const s=customerStats(prov,dist); if(!s||!s.total) return '<div style="color:var(--muted);font-size:12px">— ไม่มีข้อมูลลูกค้า</div>';
  const bar=(lab,v,color)=>{ const pct=s.total?v/s.total*100:0; return `<div class="drow"><div class="t"><span class="nm">${lab}</span><span class="vv">${fmt(v)} <span style="color:var(--muted);font-weight:600">${pct.toFixed(0)}%</span></span></div><div class="bar2"><i style="width:${Math.max(2,pct)}%;background:${color}"></i></div></div>`; };
  const tot=s.newM+s.retM, nw=tot?s.newM/tot*100:0, rt=tot?s.retM/tot*100:0;
  return `<div class="pkpi"><div class="c"><div class="k">ลูกค้าทั้งหมด</div><div class="v">${fmt(s.total)}</div></div>
      <div class="c"><div class="k">ซื้อซ้ำ (≥2 ครั้ง)</div><div class="v">${fmt(s.repeat)} <span style="font-size:12px;color:var(--good)">${s.repeatPct.toFixed(0)}%</span></div></div></div>
    ${bar('🔵 ซื้อ 30 วันล่าสุด',s.active30,'#0ea5e9')}
    ${bar('🟣 ซื้อซ้ำภายใน 60 วัน',s.rep60,'#8b5cf6')}
    ${bar('🟢 ลูกค้าประจำ (≥3 ครั้ง)',s.rep3,'#16a34a')}
    <div class="drow"><div class="t"><span class="nm">เดือนนี้: ใหม่ vs กลับมาซื้อ</span><span class="vv">${fmt(s.newM)} / ${fmt(s.retM)}</span></div>
      <div class="bar2" style="display:flex;background:transparent">${nw?`<i style="width:${nw}%;background:#f59e0b;border-radius:5px 0 0 5px"></i>`:''}${rt?`<i style="width:${rt}%;background:#16a34a;border-radius:0 5px 5px 0"></i>`:''}</div>
      <div class="sub"><span style="color:#f59e0b">■</span> ใหม่ ${fmt(s.newM)} (${nw.toFixed(0)}%) · <span style="color:#16a34a">■</span> กลับมาซื้อ ${fmt(s.retM)} (${rt.toFixed(0)}%)</div></div>`;
}
async function fillCust(prov,dist){ await ensureCust(SELTAB.brand); if(FOCUSPROV!==prov) return; const slot=$('#custSlot'); if(slot) slot.innerHTML=custBlock(prov,dist); }
/* previous-month tab for the current brand (for growth mode) */
function prevTab(){ return TABS.find(t=>t.brand===SELTAB.brand && t.mi===SELTAB.mi-1) || null; }
function brandMonths(){ return TABS.filter(t=>t.brand===SELTAB.brand && t.mi>0).sort((a,b)=>a.mi-b.mi); }
/* GROWTH[prov] = {cur, prev, pct (null=ใหม่)} for the selected metric vs previous month */
async function computeGrowth(){ const pt=prevTab(); if(!pt){ GROWTH=null; return; } await loadTab(pt.gid);
  const cur=aggregate().prov, prev=aggregateRows(RAW[pt.gid]||[]).prov; GROWTH={};
  new Set([...Object.keys(cur),...Object.keys(prev)]).forEach(k=>{
    const c=metricVal(cur[k],METRIC), p=metricVal(prev[k],METRIC);
    GROWTH[k]={ cur:c, prev:p, pct: p>0?((c-p)/p*100):(c>0?null:0), isNew:p<=0&&c>0 }; }); }

/* ---- choropleth coloring (quantile, heat ramp) ---- */
const RAMP=['#ffffcc','#ffeda0','#fed976','#feb24c','#fd8d3c','#fc4e2a','#e31a1c','#b10026'];
const GROWTH_RAMP=['#b2182b','#ef8a62','#fddbc7','#d9f0d3','#7fbf7b','#1a9850']; // ร่วง(แดง) → โต(เขียว)
const GROWTH_BREAKS=[-25,-5,0,5,25]; // 6 colors: <-25,-25..-5,-5..0,0..5,5..25,25+
const EMPTY='color-mix(in oklab, var(--muted) 14%, var(--surface))';
let BREAKS=[];
function quantileBreaks(vals,ramp){ const v=vals.filter(x=>x>0).sort((a,b)=>a-b); const out=[]; if(!v.length)return out; const n=ramp.length-1; for(let i=1;i<=n;i++)out.push(v[Math.min(v.length-1,Math.floor(v.length*i/(n+1)))]); return out; }
function computeBreaks(){ BREAKS = FIXEDBREAKS || quantileBreaks(Object.values(AGG.prov).map(o=>metricVal(o,METRIC)),RAMP); }
function rampColor(v,breaks,ramp){ if(!v) return EMPTY; let i=0; while(i<breaks.length && v>breaks[i]) i++; return ramp[i]; }
const colorFor=v=>rampColor(v,BREAKS,RAMP);
function growthColor(g){ if(!g||(g.cur<=0&&g.prev<=0)) return EMPTY; if(g.isNew) return '#6d28d9'; if(g.pct==null) return EMPTY;
  let i=0; while(i<GROWTH_BREAKS.length && g.pct>GROWTH_BREAKS[i]) i++; return GROWTH_RAMP[i]; }

/* ---- map ---- */
let map, geoLayer, layerByProv={};
function initMap(){ map=L.map('map',{zoomControl:true,attributionControl:false,minZoom:5,maxZoom:10}).setView([13.0,101.0],6);
  geoLayer=L.geoJSON(GEO,{ style:styleFeat, onEachFeature:(f,layer)=>{ const th=f.properties.pro_th; layerByProv[th]=layer;
      layer.on('mouseover',()=>layer.setStyle({weight:2.5,color:'#111'}));
      layer.on('mouseout',()=>geoLayer.resetStyle(layer));
      layer.on('click',()=>selectProvince(th)); } }).addTo(map);
  try{ map.fitBounds(geoLayer.getBounds(),{padding:[20,20]}); }catch{}
}
function styleFeat(f){ const th=f.properties.pro_th;
  if(MODE==='growth'&&GROWTH){ const g=GROWTH[th]; const has=g&&(g.cur>0||g.prev>0);
    return { fillColor:growthColor(g), weight:1, color:'var(--line-2)', fillOpacity:has?0.88:0.4, opacity:0.7 }; }
  const o=AGG&&AGG.prov[th]; const v=metricVal(o,METRIC);
  return { fillColor:colorFor(v), weight:1, color:'var(--line-2)', fillOpacity:v?0.86:0.5, opacity:0.7 }; }
const pctTxt=p=>p==null?'ใหม่':(p>=0?'▲+':'▼')+Math.abs(p).toFixed(0)+'%';
function refreshMap(){ computeBreaks();
  const growth=MODE==='growth'&&GROWTH;
  GEO.features.forEach(f=>{ const th=f.properties.pro_th, layer=layerByProv[th]; if(!layer)return;
    layer.setStyle(styleFeat(f));
    const o=AGG.prov[th]; const v=metricVal(o,METRIC); let tip;
    if(growth){ const g=GROWTH[th];
      tip=`<b>${th}</b><br>`+(g&&(g.cur>0||g.prev>0)
        ? `<span class="tnum">${METRIC_LABEL[METRIC]}: <b>${fmt(g.cur)}</b> <span style="color:${g.isNew?'#6d28d9':(g.pct>=0?'var(--good)':'var(--bad)')}">${pctTxt(g.pct)}</span></span><br><span class="tnum" style="color:var(--muted)">เดือนก่อน ${fmt(g.prev)}</span>`
        : `<span style="color:var(--muted)">ไม่มีข้อมูล</span>`);
    } else {
      tip=`<b>${th}</b><br><span class="tnum">${METRIC_LABEL[METRIC]}: <b>${fmt(v)}</b></span>`+
        (o?`<br><span class="tnum" style="color:var(--muted)">ออเดอร์ ${fmt(o.orders)} · ยอดขาย ${kOf(o.sales)} · AOV ${fmt(o.aov)}</span>`:`<br><span style="color:var(--muted)">ไม่มีออเดอร์</span>`);
    }
    layer.bindTooltip(tip,{className:'pv',sticky:true});
  });
  renderKpis(); renderLegend();
}
function renderKpis(){ const t=AGG.total; $('#kpis').innerHTML=
  [['ออเดอร์',fmt(t.orders)],['ยอดขายรวม',fmt(t.sales)],['AOV',fmt(t.aov)],['จังหวัดที่มีผู้ซื้อ',fmt(t.provinces)+' / 77']]
  .map(([k,v])=>`<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')
  + (t.dropped?`<div class="kpi"><div class="k">ระบุจังหวัดไม่ได้</div><div class="v" style="color:var(--muted)">${fmt(t.dropped)}</div></div>`:''); }
function renderLegend(){
  if(MODE==='growth'&&GROWTH){ const pt=prevTab();
    const labs=['ร่วง >25%','ร่วง 5–25%','ร่วง 0–5%','โต 0–5%','โต 5–25%','โต >25%'];
    const rows=GROWTH_RAMP.map((c,i)=>`<div class="row"><span class="sw" style="background:${c}"></span>${labs[i]}</div>`).join('');
    $('#legend').innerHTML=`<div class="lh">การเติบโต ${METRIC_LABEL[METRIC].split(' ')[0]}<br><span style="font-weight:400;color:var(--muted)">เทียบ ${pt?pt.month:'เดือนก่อน'}</span></div>`+rows+
      `<div class="row"><span class="sw" style="background:#6d28d9"></span>ใหม่ (เดือนก่อนไม่มี)</div>`+
      `<div class="row"><span class="sw" style="background:${EMPTY}"></span>ไม่มีข้อมูล</div>`; return; }
  if(!BREAKS.length){ $('#legend').innerHTML=''; return; }
  const rows=[]; const bnd=[0,...BREAKS];
  for(let i=0;i<RAMP.length;i++){ const lo=bnd[i]; const hi=BREAKS[i];
    const lab=i===0?`1–${fmt(hi||lo)}`:(i<BREAKS.length?`${fmt(lo+1)}–${fmt(hi)}`:`${fmt(lo+1)}+`);
    rows.push(`<div class="row"><span class="sw" style="background:${RAMP[i]}"></span>${lab}</div>`); }
  $('#legend').innerHTML=`<div class="lh">${METRIC_LABEL[METRIC]}</div>`+rows.join('')+
    `<div class="row"><span class="sw" style="background:${EMPTY}"></span>ไม่มีออเดอร์</div>`;
}

/* ---- district polygons (lazy-loaded once, filtered per province) ---- */
async function ensureDistGeo(){ if(DISTGEO)return DISTGEO; try{ DISTGEO=await (await fetch(DIST_URL)).json(); }catch{ DISTGEO={features:[]}; } return DISTGEO; }
function clearDistricts(){ if(distLayer){ map.removeLayer(distLayer); distLayer=null; }
  if(FOCUS){ if(!map.hasLayer(geoLayer)) geoLayer.addTo(map); FOCUS=false; } }
const normD=s=>stripTone(cleanDistrict(s));
async function showDistricts(th){ await ensureDistGeo(); if(FOCUSPROV!==th) return; clearDistricts();
  const o=AGG.prov[th]; const dmap={}; if(o) o.dist.forEach(d=>{ dmap[normD(d.n)]=d; });
  const feats=DISTGEO.features.filter(f=>f.properties.pro_th===th); if(!feats.length) return;
  const vals=feats.map(f=>{ const d=dmap[normD(f.properties.amp_th)]; return d?metricVal(d,METRIC):0; });
  const db=quantileBreaks(vals,RAMP);
  if(map.hasLayer(geoLayer)) map.removeLayer(geoLayer);   // FOCUS: show only this province
  FOCUS=true;
  distLayer=L.geoJSON({type:'FeatureCollection',features:feats},{
    style:f=>{ const d=dmap[normD(f.properties.amp_th)]; const v=d?metricVal(d,METRIC):0; return {fillColor:rampColor(v,db,RAMP),weight:1.2,color:'#fff',fillOpacity:v?0.92:0.5,opacity:1}; },
    onEachFeature:(f,l)=>{ const am=f.properties.amp_th, d=dmap[normD(am)];
      l.on('mouseover',()=>l.setStyle({weight:3,color:'#111'})); l.on('mouseout',()=>l.setStyle({weight:1.2,color:'#fff'}));
      l.on('click',()=>selectDistrict(th,am));
      if(d){ l.bindTooltip(`${esc(am)} · <b>${fmt(metricVal(d,METRIC))}</b>`,{permanent:true,direction:'center',className:'distlbl'}); }
      else { l.bindTooltip(`<b>${esc(am)}</b><br><span style="color:var(--muted)">ไม่มีออเดอร์</span>`,{className:'pv',sticky:true}); } }
  }).addTo(map);
  try{ map.fitBounds(distLayer.getBounds(),{padding:[50,50]}); }catch{}
}
/* อำเภอ detail — top products of that district */
function selectDistrict(prov,name){ FOCUSPROV=prov; const r=districtProducts(prov,name);
  $('#pName').innerHTML=`<span id="backProv" style="cursor:pointer;color:var(--accent)">‹ ${esc(prov)}</span> › ${esc(name)}`;
  const kpi=[['ออเดอร์',fmt(r.orders)],['ยอดขาย',fmt(r.sales)],['AOV',fmt(r.aov)],['ชิ้น',fmt(r.units)]]
    .map(([k,v])=>`<div class="c"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  const maxq=Math.max(...r.prods.map(p=>p.qty),1);
  const bars=r.prods.slice(0,20).map(p=>`<div class="drow"><div class="t"><span class="nm">${esc(p.n)}</span><span class="vv">${fmt(p.qty)} ชิ้น</span></div>
    <div class="bar2"><i style="width:${Math.max(2,p.qty/maxq*100)}%"></i></div><div class="sub">ยอดขาย ${kOf(p.sales)}</div></div>`).join('')
    || '<div style="color:var(--muted)">ไม่มีข้อมูลสินค้าในอำเภอนี้</div>';
  $('#pBody').innerHTML=`<div class="pkpi">${kpi}</div>
    <div class="dh" style="margin-top:14px">👥 ลูกค้า <span style="color:var(--muted);font-weight:400">· รวมทุกเดือนของแบรนด์</span></div>
    <div id="custSlot" style="color:var(--muted);font-size:12px">กำลังโหลดลูกค้า…</div>
    <div class="dh" style="margin-top:14px">🛍️ สินค้าขายดีใน ${esc(name)} <span style="color:var(--muted);font-weight:400">(${r.prods.length})</span></div>${bars}`;
  $('#panel').classList.add('open'); fillCust(prov,name);
  const bp=$('#backProv'); if(bp) bp.onclick=()=>selectProvince(prov);
}

/* ---- province drill-down panel ---- */
function selectProvince(th){ FOCUSPROV=th; const o=AGG.prov[th]; const layer=layerByProv[th];
  if(layer){ try{ map.fitBounds(layer.getBounds(),{padding:[40,40],maxZoom:9}); }catch{} }
  showDistricts(th);   // focus: hide other provinces, draw this one's อำเภอ polygons + labels
  $('#pName').textContent=th;
  if(!o){ $('#pBody').innerHTML='<div style="color:var(--muted);padding:20px 0">ยังไม่มีออเดอร์ในจังหวัดนี้</div>'; $('#panel').classList.add('open'); return; }
  const maxv=Math.max(...o.dist.map(d=>metricVal(d,METRIC)),1);
  const mlab=METRIC_LABEL[METRIC];
  const kpi=[['ออเดอร์',fmt(o.orders)],['ยอดขาย',fmt(o.sales)],['AOV',fmt(o.aov)],['ชิ้น',fmt(o.units)]]
    .map(([k,v])=>`<div class="c"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  const bars=o.dist.map(d=>{ const v=metricVal(d,METRIC); const w=Math.max(2,v/maxv*100);
    return `<div class="drow"><div class="t"><span class="nm">${d.n}</span><span class="vv">${v?fmt(v):'—'}</span></div>
      <div class="bar2"><i style="width:${w}%"></i></div>
      <div class="sub">ออเดอร์ ${fmt(d.orders)} · ยอดขาย ${kOf(d.sales)} · AOV ${fmt(d.aov)}</div></div>`; }).join('')
    || '<div style="color:var(--muted)">ไม่มีข้อมูลอำเภอ</div>';
  $('#pBody').innerHTML=`<div class="pkpi">${kpi}</div>
    <div class="dh" style="margin-top:14px">👥 ลูกค้า <span style="color:var(--muted);font-weight:400">· รวมทุกเดือนของแบรนด์</span></div>
    <div id="custSlot" style="color:var(--muted);font-size:12px">กำลังโหลดลูกค้า…</div>
    <div class="dh" style="margin-top:14px">📍 แยกตามอำเภอ · เรียงตาม${mlab} <span style="color:var(--muted);font-weight:400">(${o.dist.length})</span></div>${bars}`;
  $('#panel').classList.add('open'); fillCust(th,null);
}
function unfocus(){ FOCUSPROV=null; $('#panel').classList.remove('open'); clearDistricts(); try{map.fitBounds(geoLayer.getBounds(),{padding:[20,20]});}catch{} }
$('#pClose').addEventListener('click',unfocus);
$('#resetBtn').addEventListener('click',unfocus);
$('#homeBtn').addEventListener('click',()=>{ try{ (window.top||window).location.href='./'; }catch{ location.href='./'; } });

/* ---- controls ---- */
async function recompute(){ AGG=aggregate();
  const cs=$('#chanSel'); const cur=cs.value;   // refresh channel options once per tab
  if(cs.dataset.gid!==SELTAB.gid){ cs.dataset.gid=SELTAB.gid; cs.innerHTML='<option value="">ทุกช่องทาง</option>'+AGG.chans.map(c=>`<option>${c}</option>`).join(''); cs.value=cur&&AGG.chans.includes(cur)?cur:''; AGG=aggregate(); }
  if(MODE==='growth'){ await computeGrowth(); } else GROWTH=null;
  refreshMap();
}
const reselect=()=>{ if($('#panel').classList.contains('open')&&FOCUSPROV) selectProvince(FOCUSPROV); };
$('#metricSeg').addEventListener('click',async e=>{ const b=e.target.closest('button[data-m]'); if(!b)return; METRIC=b.dataset.m;
  [...$('#metricSeg').children].forEach(x=>x.classList.toggle('on',x===b)); await recompute(); reselect(); });
$('#modeSeg').addEventListener('click',async e=>{ const b=e.target.closest('button[data-mode]'); if(!b)return; MODE=b.dataset.mode;
  [...$('#modeSeg').children].forEach(x=>x.classList.toggle('on',x===b));
  if(MODE==='growth'&&!prevTab()){ /* no prior month */ } await recompute(); });
$('#chanSel').addEventListener('change',async()=>{ await recompute(); reselect(); });
$('#exCancel').addEventListener('change',async()=>{ await recompute(); reselect(); });
$('#tabSel').addEventListener('change',async e=>{ PLAYING=false; FOCUSPROV=null; SELTAB=TABS.find(t=>t.gid===e.target.value); $('#panel').classList.remove('open'); clearDistricts();
  $('#msgT').textContent='กำลังโหลด '+SELTAB.label+'…'; $('#msg').style.display='flex'; await loadTab(SELTAB.gid); $('#msg').style.display='none'; await recompute(); });

/* ---- time-lapse across the brand's months ---- */
async function playLapse(){ if(PLAYING){ PLAYING=false; return; }
  const months=brandMonths(); if(months.length<2){ alert('ชุดข้อมูลนี้มีเดือนเดียว — ยังเล่นไล่เดือนไม่ได้ (ต้องมี ≥ 2 เดือนของแบรนด์เดียวกัน)'); return; }
  PLAYING=true; const savedMode=MODE; MODE='value'; [...$('#modeSeg').children].forEach(x=>x.classList.toggle('on',x.dataset.mode==='value'));
  FOCUSPROV=null; $('#playBtn').classList.add('on'); $('#playBtn').textContent='⏸ หยุด'; $('#panel').classList.remove('open'); clearDistricts();
  $('#msgT').textContent='กำลังเตรียมไล่เดือน…'; $('#msg').style.display='flex';
  await Promise.all(months.map(t=>loadTab(t.gid))); $('#msg').style.display='none';
  const allVals=[]; months.forEach(t=>{ const a=aggregateRows(RAW[t.gid]||[]); Object.values(a.prov).forEach(o=>allVals.push(metricVal(o,METRIC))); });
  FIXEDBREAKS=quantileBreaks(allVals,RAMP);   // fixed scale → growth is visible across frames
  try{ map.fitBounds(geoLayer.getBounds(),{padding:[20,20]}); }catch{}
  for(const t of months){ if(!PLAYING)break; SELTAB=t; $('#tabSel').value=t.gid; AGG=aggregate();
    $('#lapseLbl').textContent=t.month+' 2026'; $('#lapseLbl').style.display='block'; refreshMap();
    await new Promise(r=>setTimeout(r,1300)); }
  FIXEDBREAKS=null; PLAYING=false; $('#playBtn').classList.remove('on'); $('#playBtn').textContent='▶ ไล่เดือน';
  setTimeout(()=>{ $('#lapseLbl').style.display='none'; },1400);
  MODE=savedMode; [...$('#modeSeg').children].forEach(x=>x.classList.toggle('on',x.dataset.mode===savedMode)); recompute();
}
$('#playBtn').addEventListener('click',playLapse);

/* ---- boot ---- */
(async()=>{ try{
  const [geo,tabs]=await Promise.all([ (await fetch(GEO_URL)).json(), enumTabs() ]);
  GEO=geo; TABS=tabs; buildCanon(GEO);
  $('#tabSel').innerHTML=TABS.map(t=>`<option value="${t.gid}">${t.label}</option>`).join('');
  SELTAB=TABS.find(t=>t.brand==='Terry'&&/ต\.ค/.test(t.month))||TABS[0];
  $('#tabSel').value=SELTAB.gid;
  $('#msgT').textContent='กำลังโหลดคำสั่งซื้อ…';
  await loadTab(SELTAB.gid);
  initMap(); await recompute();
  $('#msg').style.display='none';
  ensureDistGeo();   // warm the district polygons so the first province click is instant
}catch(e){ $('#msg').innerHTML='<div style="color:var(--bad);font-weight:700;padding:20px;text-align:center">โหลดแผนที่ไม่สำเร็จ<br><span style="font-weight:400;font-size:12px">'+((e&&e.message)||e)+'</span></div>'; }})();
</script>
</body>
